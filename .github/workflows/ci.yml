name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            integration/hostcompat/go.sum
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
      - name: Verify pinned modules
        run: |
          go mod verify
          go -C integration/hostcompat mod verify
      - name: Vet
        run: |
          go vet ./...
          go -C integration/hostcompat vet ./...
      - name: Unit race tests
        run: go test -race -count=1 ./...
      - name: Build example C shared library
        run: go build -trimpath -buildmode=c-shared -o "${RUNNER_TEMP}/echo.so" ./examples/echo
      - name: Real v8.0.48 host-loader compatibility
        run: go -C integration/hostcompat test -race -count=1 -v ./...
      - name: Known-vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go -C integration/hostcompat run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Install secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Secret scan
        run: gitleaks dir --no-banner --redact --exit-code 1 .
      - name: Generic credential-pattern scan
        shell: bash
        run: |
          set -euo pipefail
          # Do not print matches: an accidental credential must not enter logs.
          if git grep -qEI '(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!go.sum' ':!integration/hostcompat/go.sum'; then
            echo 'Credential-like material found; remove it before publishing.'
            exit 1
          fi
